name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: deals
          POSTGRES_USER: deals
          POSTGRES_PASSWORD: deals
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deals -d deals"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            pnpm exec commitlint --to "$HEAD_SHA" --verbose
          else
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://deals:deals@127.0.0.1:5432/deals
      - run: pnpm test
        env:
          REVIEW_TEST_DATABASE_URL: postgres://deals:deals@127.0.0.1:5432/deals
      - run: pnpm build

  # Builds the production images exactly as the server does, without pushing them.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f docker/web.Dockerfile -t deals-web .
      - run: docker build -f docker/worker.Dockerfile -t deals-worker .
