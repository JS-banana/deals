name: deals

# Production stack. Secrets and settings come from .env next to this file (see .env.example).
# Only the web container is reachable, on 127.0.0.1:${WEB_PORT}; nginx on the host terminates TLS.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-database-url: &database-url postgres://deals:${POSTGRES_PASSWORD}@db:5432/deals

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deals
      POSTGRES_USER: deals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deals -d deals"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *logging

  # One-shot: applies pending migrations before web and worker start.
  migrate:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: deals-worker
    command: ["node", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: deals-web
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      MEDIA_DIR: /data/media
      COMMUNITY_HASH_SECRET: ${COMMUNITY_HASH_SECRET:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - media:/data/media:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 768m
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: deals-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      SITE_URL: ${SITE_URL}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      MEDIA_DIR: /data/media
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in .env}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      TRANSLATE_BASE_URL: ${TRANSLATE_BASE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_EXTRA_BODY: ${TRANSLATE_EXTRA_BODY:-}
      TRANSLATE_LLM_REVIEW: ${TRANSLATE_LLM_REVIEW:-false}
      REVIEW_BASE_URL: ${REVIEW_BASE_URL:-}
      REVIEW_API_KEY: ${REVIEW_API_KEY:-}
      REVIEW_MODEL: ${REVIEW_MODEL:-}
      REVIEW_EXTRA_BODY: ${REVIEW_EXTRA_BODY:-}
      AUTO_APPROVE_CREATE: ${AUTO_APPROVE_CREATE:-false}
      AUTO_APPROVE_UPDATE: ${AUTO_APPROVE_UPDATE:-false}
      AUTO_REJECT_ENABLED: ${AUTO_REJECT_ENABLED:-false}
      AUTO_APPROVE_MIN_SCORE: ${AUTO_APPROVE_MIN_SCORE:-85}
      AUTO_REJECT_BELOW: ${AUTO_REJECT_BELOW:-60}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_KIND: ${NOTIFY_WEBHOOK_KIND:-slack}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_ACCESS_TOKEN: ${REDDIT_ACCESS_TOKEN:-}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_API_PROVIDER: ${SEARCH_API_PROVIDER:-}
      GROUP_WEBHOOK_SLACK_URL: ${GROUP_WEBHOOK_SLACK_URL:-}
      GROUP_WEBHOOK_DISCORD_URL: ${GROUP_WEBHOOK_DISCORD_URL:-}
      GROUP_WEBHOOK_FEISHU_URL: ${GROUP_WEBHOOK_FEISHU_URL:-}
      GROUP_WEBHOOK_WECOM_URL: ${GROUP_WEBHOOK_WECOM_URL:-}
      GROUP_WEBHOOK_DINGTALK_URL: ${GROUP_WEBHOOK_DINGTALK_URL:-}
      SOURCE_GITHUB_BFCM_ENABLED: ${SOURCE_GITHUB_BFCM_ENABLED:-}
      SOURCE_JETBRAINS_ENABLED: ${SOURCE_JETBRAINS_ENABLED:-}
      SOURCE_GITHUB_MAC_ENABLED: ${SOURCE_GITHUB_MAC_ENABLED:-}
      SOURCE_GITHUB_STARTUP_ENABLED: ${SOURCE_GITHUB_STARTUP_ENABLED:-}
      SOURCE_GITHUB_FRONTEND_ENABLED: ${SOURCE_GITHUB_FRONTEND_ENABLED:-}
      SOURCE_GITHUB_FREE_DEV_ENABLED: ${SOURCE_GITHUB_FREE_DEV_ENABLED:-}
      SOURCE_REDDIT_MACAPPS_ENABLED: ${SOURCE_REDDIT_MACAPPS_ENABLED:-}
      SOURCE_REDDIT_APPHOOKUP_ENABLED: ${SOURCE_REDDIT_APPHOOKUP_ENABLED:-}
      SOURCE_REDDIT_SAAS_ENABLED: ${SOURCE_REDDIT_SAAS_ENABLED:-}
      SOURCE_REDDIT_SIDEPROJECT_ENABLED: ${SOURCE_REDDIT_SIDEPROJECT_ENABLED:-}
      SOURCE_REDDIT_INDIEHACKERS_ENABLED: ${SOURCE_REDDIT_INDIEHACKERS_ENABLED:-}
      SOURCE_REDDIT_LOCALLLAMA_ENABLED: ${SOURCE_REDDIT_LOCALLLAMA_ENABLED:-}
      SOURCE_REDDIT_CLAUDEAI_ENABLED: ${SOURCE_REDDIT_CLAUDEAI_ENABLED:-}
      SOURCE_REDDIT_GEMINIAI_ENABLED: ${SOURCE_REDDIT_GEMINIAI_ENABLED:-}
      SOURCE_REDDIT_CHATGPT_ENABLED: ${SOURCE_REDDIT_CHATGPT_ENABLED:-}
      SOURCE_REDDIT_CURSOR_ENABLED: ${SOURCE_REDDIT_CURSOR_ENABLED:-}
      SOURCE_REDDIT_CODEX_ENABLED: ${SOURCE_REDDIT_CODEX_ENABLED:-}
      SOURCE_REDDIT_SINGULARITY_ENABLED: ${SOURCE_REDDIT_SINGULARITY_ENABLED:-}
      SOURCE_HN_FREE_CREDITS_ENABLED: ${SOURCE_HN_FREE_CREDITS_ENABLED:-}
      SOURCE_HN_FREE_API_ENABLED: ${SOURCE_HN_FREE_API_ENABLED:-}
      SOURCE_HN_BLACK_FRIDAY_ENABLED: ${SOURCE_HN_BLACK_FRIDAY_ENABLED:-}
      SOURCE_HN_LIFETIME_DEAL_ENABLED: ${SOURCE_HN_LIFETIME_DEAL_ENABLED:-}
      SOURCE_HN_DISCOUNT_ENABLED: ${SOURCE_HN_DISCOUNT_ENABLED:-}
      SOURCE_X_CLOUDFLARE_ENABLED: ${SOURCE_X_CLOUDFLARE_ENABLED:-}
      SOURCE_X_CREDITS_ENABLED: ${SOURCE_X_CREDITS_ENABLED:-}
      SOURCE_SEARCH_CREDITS_ENABLED: ${SOURCE_SEARCH_CREDITS_ENABLED:-}
      SOURCE_USER_TIPS_ENABLED: ${SOURCE_USER_TIPS_ENABLED:-}
      SOURCE_GITHUB_MAC_APPS_ENABLED: ${SOURCE_GITHUB_MAC_APPS_ENABLED:-}
      SOURCE_GITHUB_FREE_LLM_ENABLED: ${SOURCE_GITHUB_FREE_LLM_ENABLED:-}
      SOURCE_CLOUDFLARE_ENABLED: ${SOURCE_CLOUDFLARE_ENABLED:-}
      SOURCE_OPENAI_ENABLED: ${SOURCE_OPENAI_ENABLED:-}
      SOURCE_V2EX_DEALS_ENABLED: ${SOURCE_V2EX_DEALS_ENABLED:-}
      SOURCE_AGENT_COLLECTED_ENABLED: ${SOURCE_AGENT_COLLECTED_ENABLED:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    logging: *logging

volumes:
  pgdata:
  media:
